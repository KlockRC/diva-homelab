name: Sonar branch scan request

on:
  push:
    branches: [development, homolog, main]

# This workflow runs code from pushed branches, so it carries no credentials,
# uses no actions, and receives no token or OIDC permissions. The trusted
# workflow_run dispatcher on the default branch performs the actual scan.
permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mark branch update for trusted Sonar dispatcher
        run: echo "Branch update recorded for trusted Sonar analysis."
